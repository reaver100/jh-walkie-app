<title>무전기</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#262d36;
    --txt:#e6edf3; --dim:#8b949e;
    --accent:#2f81f7; --live:#f85149; --ok:#3fb950; --warn:#d29922;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; overscroll-behavior:none}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  header{
    padding:12px 16px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; flex:none;
  }
  header h1{font-size:16px; margin:0; font-weight:700; letter-spacing:-.3px}
  .pill{
    margin-left:auto; font-size:12px; color:var(--dim);
    border:1px solid var(--line); border-radius:999px; padding:4px 10px; white-space:nowrap;
  }
  .pill b{color:var(--txt); font-weight:600}
  main{flex:1; display:flex; flex-direction:column; min-height:0}

  /* 접속 화면 */
  #setup{padding:24px 20px; display:flex; flex-direction:column; gap:14px; overflow-y:auto}
  label{font-size:13px; color:var(--dim); display:block; margin-bottom:6px}
  input{
    width:100%; padding:14px; font-size:16px; border-radius:12px;
    border:1px solid var(--line); background:var(--panel); color:var(--txt);
  }
  input:focus{outline:none; border-color:var(--accent)}
  .primary{
    width:100%; padding:16px; font-size:16px; font-weight:700; border:0; border-radius:12px;
    background:var(--accent); color:#fff; margin-top:4px;
  }
  .primary:disabled{opacity:.5}
  .hint{font-size:12px; color:var(--dim); line-height:1.7}
  .hint b{color:var(--txt)}
  #install{
    display:none; padding:12px 14px; border:1px solid var(--accent); border-radius:12px;
    background:rgba(47,129,247,.1); font-size:13px; line-height:1.6;
  }
  #install button{
    margin-top:8px; padding:10px 16px; border:0; border-radius:9px;
    background:var(--accent); color:#fff; font-size:14px; font-weight:600;
  }

  /* 통신 화면 */
  #live{display:none; flex:1; flex-direction:column; min-height:0}
  #roster{flex:1; overflow-y:auto; padding:10px 14px; display:flex; flex-direction:column; gap:8px}
  .row{
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    border:1px solid var(--line); border-radius:12px; background:var(--panel);
  }
  .row.sel{border-color:var(--accent); background:rgba(47,129,247,.12)}
  .row.on{border-color:var(--live)}
  .row.off{opacity:.55; border-style:dashed}
  .row.off .nm{font-weight:500}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--dim); flex:none}
  .dot.up{background:var(--ok)}
  .dot.tx{background:var(--live); animation:blink .7s infinite}
  @keyframes blink{50%{opacity:.25}}
  .nm{font-size:15px; font-weight:600}
  .sub{margin-left:auto; font-size:12px; color:var(--dim)}
  .sub.hot{color:var(--live); font-weight:700}

  #pad{flex:none; padding:10px 16px 20px; border-top:1px solid var(--line)}
  #ver{margin:14px 0 4px; text-align:center; font-size:11.5px; color:var(--dim); opacity:.75}
  #tgt{font-size:13px; text-align:center; color:var(--dim); margin-bottom:10px; min-height:18px}
  #tgt b{color:var(--accent)}
  /* 테블릿 가로모드: 명단은 왼쪽, 말하기는 오른쪽 */
  @media (orientation: landscape) and (min-width: 700px){
    #live{ flex-direction:row; gap:0 }
    #roster{ flex:1 1 58%; border-right:1px solid var(--line) }
    #pad{ flex:1 1 42%; display:flex; flex-direction:column; justify-content:center }
    #ptt{ height:150px }
  }
  /* 가로인데 화면이 낮으면 버튼을 낮춘다 */
  @media (orientation: landscape) and (max-height: 460px){
    #ptt{ height:84px; font-size:17px }
  }
  #ptt{
    width:100%; height:120px; border:0; border-radius:20px; font-size:19px; font-weight:800;
    background:linear-gradient(180deg,#2f81f7,#1f6feb); color:#fff; letter-spacing:-.3px;
    touch-action:none; transition:transform .06s;
  }
  #ptt.down{background:linear-gradient(180deg,#f85149,#da3633); transform:scale(.98)}
  #ptt:disabled{opacity:.45}
  .bar{display:flex; gap:8px; margin-top:10px}
  .bar button{
    flex:1; padding:11px; border:1px solid var(--line); border-radius:11px;
    background:var(--panel); color:var(--dim); font-size:13px; font-weight:600;
  }
  .bar button.danger{color:var(--live); border-color:rgba(248,81,73,.4)}
  .bar button.call{color:var(--ok); border-color:rgba(63,185,80,.45)}
  #push{
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    border:1px solid var(--line); border-radius:12px; background:var(--panel); font-size:13px;
  }
  #push b{color:var(--txt)}
  #push span{color:var(--dim); line-height:1.5}
  #push button{
    margin-left:auto; flex:none; padding:9px 14px; border:0; border-radius:9px;
    background:var(--accent); color:#fff; font-size:13px; font-weight:600;
  }
  #push.on button{background:#21262d; color:var(--ok)}

  #ringbar{position:fixed;left:12px;right:12px;bottom:18px;z-index:60;display:none;
  align-items:center;gap:10px;background:#b4232a;color:#fff;border-radius:14px;
  padding:12px 14px;box-shadow:0 10px 28px rgba(0,0,0,.45);font-size:15px;font-weight:700}
#ringbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ringbar button{flex:0 0 auto;background:#fff;color:#b4232a;border:0;border-radius:10px;
  padding:10px 14px;font-size:15px;font-weight:800}
#toast{
    position:fixed; left:50%; bottom:170px; transform:translateX(-50%);
    background:#1f2731; border:1px solid var(--line); color:var(--txt);
    padding:11px 16px; border-radius:11px; font-size:13.5px; max-width:86%;
    text-align:center; opacity:0; transition:opacity .25s; pointer-events:none; z-index:50;
  }
  #toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1>무전기</h1>
  <span class="pill" id="pill">대기 중</span>
</header>

<main>
  <section id="setup">
    <div id="install">
      <b>홈 화면에 추가하면 앱처럼 쓸 수 있습니다.</b><br>
      주소창 없이 전체 화면으로 열립니다.
      <br><button id="installBtn">홈 화면에 추가</button>
    </div>

    <div>
      <label for="nm">내 이름 (가족끼리 서로 다르게)</label>
      <input id="nm" type="text" autocomplete="off" placeholder="아빠">
    </div>
    <button class="primary" id="join">접속하기</button>

    <div id="push">
      <span><b>꺼져 있어도 호출 받기</b><br>알림을 켜두면 앱이 닫혀 있어도 울립니다</span>
      <button id="pushBtn">알림 켜기</button>
    </div>

    <div class="hint">
      · 채널은 <b>our-family</b> 로 고정되어 있습니다.<br>
      · 처음 접속할 때 <b>마이크 권한</b>을 허용해 주세요.<br>
      · 같은 공간에서 쓸 때는 하울링 방지를 위해 <b>이어폰</b>을 권장합니다.<br>
      · 접속 중에는 화면이 자동으로 꺼지지 않습니다.<br>
      · 가족끼리 서로 다른 이름을 쓰면 됩니다.
    </div>
    <div id="ver"></div>
  </section>

  <section id="live">
    <div id="roster"></div>
    <div id="pad">
      <div id="tgt"></div>
      <button id="ptt" disabled>누르고 말하기</button>
      <div class="bar">
        <button id="leave" class="danger">나가기</button>
      </div>
    </div>
  </section>
</main>

<div id="toast"></div>
<audio id="sink" autoplay playsinline></audio>

<script src="peerjs.min.js"></script>
<script>
(function(){
  "use strict";
  /* 설치된 앱에 남아 있는 세로 고정을 푼다 (테블릿 가로모드) */
  try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}

  var SLOTS = 24, NS = "jhwt", CHANNEL = "our-family";
  var $ = function(id){ return document.getElementById(id); };
  var setup=$("setup"), live=$("live"), pill=$("pill"), roster=$("roster"),
      ptt=$("ptt"), tgtEl=$("tgt"), joinBtn=$("join"), nmEl=$("nm");

  var peer=null, mySlot=0, channel=CHANNEL, myName="";
  var micStream=null, micTrack=null;
  var conns={}, pending={}, calls={}, clones={}, names={}, talking={}, talkAt={}, dmFrom={}, lastSeen={};
  var joined=false, txing=false, txIds=[], target="";
  var wakeLock=null, ac=null, keepAlive=null;
  var scanTimer=null, pingTimer=null, memberTimer=null, rebuilding=false;
  var probeCursor=1, legacyTick=0;

  /* ---------- 유틸 ---------- */
  var toastT;
  function toast(m){
    var t=$("toast"); t.textContent=m; t.classList.add("show");
    clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); },2600);
  }
  function slug(s){
    return String(s||"").toLowerCase().replace(/[^a-z0-9가-힣-]/g,"").slice(0,24);
  }
  function hash(s){
    var h=5381; for(var i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0;
    return h.toString(36);
  }
  function idFor(n){ return NS+"-"+hash(channel)+"-"+n; }

  /* 자리 번호 대신 각자 고유 번호로 찾아간다.
     신호 서버에 죽은 자리가 쌓여도 영향을 받지 않는다. */
  var LEGACY = 24;                /* 옛 방식(자리 번호)으로 들어온 기기를 위한 범위 */
  var KEYS_KEY = "jhwt.keys", DEV_KEY = "jhwt.devkey";

  /* 가족이 아닌 이름(점검용 등)은 저장 목록에서 지운다 */
  function familyName(nm){
    for(var i=0;i<ROSTER.length;i++) if(ROSTER[i].name === nm) return true;
    return false;
  }
  function tidyLists(){
    try{
      var k = JSON.parse(localStorage.getItem("jhwt.known") || "[]");
      var k2 = k.filter(familyName);
      if(k2.length !== k.length) localStorage.setItem("jhwt.known", JSON.stringify(k2));
    }catch(e){}
    ["jhwt.keys","jhwt.pid"].forEach(function(key){
      try{
        var m = JSON.parse(localStorage.getItem(key) || "{}"), changed = false;
        Object.keys(m).forEach(function(nm){ if(!familyName(nm)){ delete m[nm]; changed = true; } });
        if(changed) localStorage.setItem(key, JSON.stringify(m));
      }catch(e){}
    });
    try{
      var r = JSON.parse(localStorage.getItem("jhwt.roster") || "[]");
      var r2 = r.filter(function(x){ return familyName(x.name); });
      if(r2.length !== r.length) localStorage.setItem("jhwt.roster", JSON.stringify(r2));
    }catch(e){}
  }
  var myKey = "", myPeerId = "", dialV = {};

  function keyStore(){ try{ return JSON.parse(localStorage.getItem(KEYS_KEY)||"{}"); }catch(e){ return {}; } }
  function rememberKey(nm, k){
    if(!nm || !k || nm === myName || !familyName(nm)) return;
    var m = keyStore(); if(m[nm] === k) return;
    m[nm] = k; try{ localStorage.setItem(KEYS_KEY, JSON.stringify(m)); }catch(e){}
  }
  try{ tidyLists(); }catch(e){}
  function devKey(){
    var k = "";
    try{ k = localStorage.getItem(DEV_KEY) || ""; }catch(e){}
    if(!k){
      k = Array.prototype.map.call(crypto.getRandomValues(new Uint8Array(6)), function(b){
        return ("0"+b.toString(16)).slice(-2);
      }).join("");
      try{ localStorage.setItem(DEV_KEY, k); }catch(e){}
    }
    return k;
  }
  function peerIdOf(key, v){ return NS+"-"+hash(channel)+"-"+key + (v>1 ? "-"+v : ""); }

  /* 내 번호: 알림을 켰으면 등록 번호에서, 아니면 이 기기 고유값에서 */
  async function initKey(){
    try{
      if("serviceWorker" in navigator && "PushManager" in window && Notification.permission === "granted"){
        var reg = await navigator.serviceWorker.ready;
        var sub = await reg.pushManager.getSubscription();
        if(sub){
          myEndpoint = sub.endpoint;
          myPid = await pidOf(sub.endpoint);
          myKey = myPid.slice(0,12);
          return;
        }
      }
    }catch(e){}
    myKey = devKey();
  }

  /* 연락할 상대: 기본 명단 + 기억해 둔 번호 */
  function targetKeys(){
    var out = {}, pm = pidMap(), ks = keyStore();
    ROSTER.forEach(function(r){ if(r.name !== myName) out[r.name] = r.id.slice(0,12); });
    Object.keys(pm).forEach(function(nm){ if(nm !== myName) out[nm] = pm[nm].slice(0,12); });
    Object.keys(ks).forEach(function(nm){ if(nm !== myName) out[nm] = ks[nm]; });
    return out;
  }
  var VARIANTS = 4, dialWide = {}, VAR_KEY = "jhwt.var";
  function varStore(){ try{ return JSON.parse(localStorage.getItem(VAR_KEY)||"{}"); }catch(e){ return {}; } }
  function rememberVar(nm, v){
    var m = varStore(); if(m[nm] === v) return;
    m[nm] = v; try{ localStorage.setItem(VAR_KEY, JSON.stringify(m)); }catch(e){}
  }
  function connectedTo(key){
    for(var v=1; v<=VARIANTS; v++) if(conns[peerIdOf(key,v)]) return true;
    return false;
  }
  /* 아는 상대에게만 연락한다 — 빈 자리를 뒤지지 않으니 가볍다 */
  /* 유령이 원래 자리를 막고 있어도 바로 찾도록, 변형 자리를 한꺼번에 두드린다 */
  function dialKnown(){
    if(!peer) return;
    var t = targetKeys();
    Object.keys(t).forEach(function(nm){
      var key = t[nm];
      if(!key || key === myKey) return;
      if(connectedTo(key)){
        dialWide[nm] = 1;
        for(var cv=1; cv<=VARIANTS; cv++) if(conns[peerIdOf(key,cv)]) { rememberVar(nm, cv); break; }
        return;
      }
      /* 지난번에 찾았던 자리를 먼저, 그 다음 1번부터 하나씩 넓혀간다 */
      var order = [], last = varStore()[nm];
      if(last) order.push(last);
      var w = dialWide[nm] || 1;
      for(var v=1; v<=w; v++) if(order.indexOf(v) < 0) order.push(v);
      for(var i=0; i<order.length; i++){
        var id = peerIdOf(key, order[i]);
        if(conns[id] || pending[id]) continue;
        reach(id);
      }
      dialWide[nm] = Math.min(VARIANTS, w + 1);
    });
  }

  /* ---------- 소리 / 진동 ---------- */
  /* 소리 경로를 '음악 재생'으로 둔다.
     아이폰은 무음 스위치, 안드로이드는 진동 모드를 이 경로로 넘길 수 있다.
     마이크를 잡는 동안만 '통화' 경로로 바꾼다. */
  function audioSession(mode){
    try{ if(navigator.audioSession) navigator.audioSession.type = mode; }catch(e){}
  }
  function audioCtx(){
    if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(ac && ac.state==="suspended"){ try{ ac.resume(); }catch(e){} }
    return ac;
  }
  function beep(freq,dur,vol){
    var c=audioCtx(); if(!c) return;
    try{
      var o=c.createOscillator(), g=c.createGain();
      o.type="sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(vol||0.07, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime+dur);
    }catch(e){}
  }
  function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

  // 예약 발음 — 벨소리를 미리 일정에 걸어둔다
  var ringNodes = [];
  function tone(at, freq, dur, vol){
    var c = audioCtx(); if(!c) return;
    try{
      var o=c.createOscillator(), g=c.createGain();
      ringNodes.push(o);
      o.type="sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(vol||0.30, at+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, at+dur);
      o.connect(g); g.connect(c.destination);
      o.start(at); o.stop(at+dur+0.02);
    }catch(e){}
  }
  var ringing = false;
  // 띵-띵-띠 를 10번. 전화벨처럼.
  function ringTone(times, who){
    var c = audioCtx(); if(!c || ringing) return;
    ringing = true;
    showRingBar(who);
    times = times || 10;
    var t0 = c.currentTime + 0.05;
    for(var i=0;i<times;i++){
      var b = t0 + i*0.95;
      tone(b,        880, 0.15);
      tone(b + 0.20, 880, 0.15);
      tone(b + 0.40, 1245, 0.26);
    }
    var pat = [];
    for(var k=0;k<times;k++) pat.push(220, 90, 220, 90, 300, 240);
    buzz(pat);
    setTimeout(function(){ ringing = false; }, times*950 + 300);
  }
  function stopRing(){
    ringing = false;
    try{ navigator.vibrate && navigator.vibrate(0); }catch(e){}
    ringNodes.forEach(function(o){ try{ o.stop(); }catch(e){} try{ o.disconnect(); }catch(e){} });
    ringNodes = [];
    hideRingBar();
    /* 알림창도 함께 닫는다 */
    try{
      navigator.serviceWorker && navigator.serviceWorker.ready.then(function(reg){
        if(reg.active) reg.active.postMessage({ t:"stopring" });
        reg.getNotifications({ tag:"walkie-call" }).then(function(ns){
          ns.forEach(function(n){ try{ n.close(); }catch(e){} });
        }).catch(function(){});
      });
    }catch(e){}
  }
  /* 울리는 동안 화면 위에 뜨는 '호출 끄기' 띠 */
  function showRingBar(who){
    var b = document.getElementById("ringbar");
    if(!b){
      b = document.createElement("div");
      b.id = "ringbar";
      b.innerHTML = '<span id="ringwho">호출이 왔습니다</span><button id="ringstop">호출 끄기</button>';
      document.body.appendChild(b);
      document.getElementById("ringstop").onclick = stopRing;
    }
    document.getElementById("ringwho").textContent =
      (who ? who + "님이 부르고 있습니다" : "호출이 왔습니다");
    b.style.display = "flex";
  }
  function hideRingBar(){
    var b = document.getElementById("ringbar");
    if(b) b.style.display = "none";
  }
  function cueIncoming(dm){
    if(dm){ beep(980,0.12); setTimeout(function(){ beep(1240,0.14); },130); buzz([40,60,40,60,80]); }
    else  { beep(760,0.11); buzz(55); }
  }

  /* ---------- 화면 꺼짐 방지 + 백그라운드 유지 ---------- */
  async function holdScreen(on){
    try{
      if(on){
        if("wakeLock" in navigator && !wakeLock)
          wakeLock = await navigator.wakeLock.request("screen");
      }else if(wakeLock){ await wakeLock.release(); wakeLock=null; }
    }catch(e){}
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState==="visible" && joined){ holdScreen(true); watchdog(); }
  });
  window.addEventListener("online", function(){ if(joined) watchdog(); });
  window.addEventListener("pageshow", function(){ if(joined) watchdog(); });
  function keepAudioAlive(on){
    if(on){
      audioSession("playback");
      var c=audioCtx(); if(!c) return;
      if(keepAlive) return;
      try{
        var o=c.createOscillator(), g=c.createGain();
        g.gain.value=0.0001; o.frequency.value=20;
        o.connect(g); g.connect(c.destination); o.start();

  /* ---------- 연결 ---------- */
  /* 중계 서버(TURN).
     데이터망↔와이파이처럼 직접 연결이 안 되는 조합에서도 붙게 해준다.
     직접 연결이 가능하면 그쪽을 쓰므로 평소 음질·지연은 그대로다. */
  var TURN_USER = "cc19afd0754ac7955e667884";
  var TURN_PASS = "oBjiNfnbIh8lJO3Q";
  var ICE = [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun.relay.metered.ca:80" },
    { urls: "turn:global.relay.metered.ca:80",                 username: TURN_USER, credential: TURN_PASS },

    { urls: "turns:global.relay.metered.ca:443?transport=tcp", username: TURN_USER, credential: TURN_PASS }
  ];
  /* 점검용: test- 채널에서 ?ice=relay 를 붙이면 중계만 쓰도록 강제한다 */
  var FORCE_RELAY = false;
  try{
    FORCE_RELAY = new URLSearchParams(location.search).get("ice") === "relay";
  }catch(e){}
  function newPeer(id){
    var cfg = { iceServers: ICE };
    if(FORCE_RELAY && /^test-/.test(channel)) cfg.iceTransportPolicy = "relay";
    return new Peer(id, { debug:0, pingInterval:3000, config: cfg });

  function claimId(id, slot){
    return new Promise(function(res){
      var p=newPeer(id), done=false;
      var t=setTimeout(function(){ if(!done){ done=true; try{p.destroy();}catch(e){} res(false);} },8000);
      p.on("open", function(){
        if(done) return; done=true; clearTimeout(t);
        peer=p; myPeerId=id; mySlot=slot||0;
        try{ showVer("자리 " + id.split("-").slice(2).join("-")); }catch(e){}
        res(true);
      });
      p.on("error", function(e){
        if(done) return; done=true; clearTimeout(t);
        lastClaimErr = (e && e.type) || "unknown";
        try{p.destroy();}catch(e2){}
        res(false);
      });
    });
  }
  var lastClaimErr = "";
  async function claimMine(){
    if(!myKey) await initKey();
    for(var v=1; v<=VARIANTS; v++) if(await claimId(peerIdOf(myKey, v))) return true;
    for(var n=1; n<=4; n++) if(await claimId(idFor(n), n)) return true;      /* 마지막 수단 */
    return false;
  }
  /* 마이크를 들고 있으면 아이폰이 블루투스 이어폰을 통화 모드로 바꿔
     듣던 음악이 끊긴다. 그래서 말할 때만 잡고, 2분 조용하면 놓는다.
     음성 연결 자체는 끊지 않고 '무음 트랙'으로 유지해 양방향을 지킨다. */
  var MIC_HOLD = 120000;
  var silentDst = null, micTimer = null, outTrack = {}, pttHeld = false;

  function silentTrack(){
    audioCtx();
    if(!silentDst){
      silentDst = ac.createMediaStreamDestination();
      var g = ac.createGain(); g.gain.value = 0;
      var o = ac.createOscillator(); o.connect(g); g.connect(silentDst);
      try{ o.start(); }catch(e){}
    }
    return silentDst.stream.getAudioTracks()[0].clone();
  }
  function streamFor(id){
    if(!clones[id]){
      var t = micTrack ? micTrack.clone() : silentTrack();
      t.enabled = false;
      outTrack[id] = t;
      clones[id] = new MediaStream([t]);
    }
    return clones[id];
  }
  /* 지금 보내고 있는 트랙을 통째로 갈아끼운다 (연결은 그대로) */
  function swapOut(id, track){
    var mc = calls[id];
    if(mc && mc.peerConnection){
      try{
        var sn = mc.peerConnection.getSenders().filter(function(x){
          return x.track && x.track.kind === "audio";
        })[0];
        if(sn) sn.replaceTrack(track);
      }catch(e){}
    }
    if(outTrack[id] && outTrack[id] !== track){ try{ outTrack[id].stop(); }catch(e){} }
    outTrack[id] = track;
    clones[id] = new MediaStream([track]);
  }
  function micHoldBump(){
    clearTimeout(micTimer);
    micTimer = setTimeout(function(){ if(!txing && !pttHeld) releaseMic(); }, MIC_HOLD);
  }
  async function acquireMic(){
    if(micTrack && micTrack.readyState === "live"){ micHoldBump(); return true; }
    var p;
    try{
      p = navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}, video:false
      });
    }catch(e){ return false; }
    try{ micStream = await p; }catch(e){ return false; }
    micTrack = micStream.getAudioTracks()[0];
    /* 이어폰을 꽂거나 빼면 마이크 트랙이 끊긴다 — 다음 말하기에서 다시 잡게 한다 */
    try{ micTrack.onended = function(){ if(!txing) releaseMic(); }; }catch(e){}
    audioSession("play-and-record");
    Object.keys(conns).forEach(function(id){
      var t = micTrack.clone(); t.enabled = false; swapOut(id, t);
    });
    micHoldBump();
    return true;
  }
  /* 소리 장치가 바뀌면(이어폰 연결·해제) 마이크를 놓아 다음에 새 장치로 잡게 한다 */
  try{
    navigator.mediaDevices && navigator.mediaDevices.addEventListener &&
    navigator.mediaDevices.addEventListener("devicechange", function(){
      if(!txing && !pttHeld && micStream) releaseMic();
    });
  }catch(e){}
  function releaseMic(){
    clearTimeout(micTimer); micTimer = null;
    Object.keys(conns).forEach(function(id){ swapOut(id, silentTrack()); });
    if(micStream){ try{ micStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} }
    micStream = null; micTrack = null;
    audioSession("playback");
  }
  /* 자리를 조금씩 나눠서 두드린다 — 한 번에 24개를 열면 폰이 버겁다 */
  function sweep(count){
    var tried=0, guard=0;
    while(tried<count && guard<LEGACY){
      guard++;
      var k=probeCursor; probeCursor = probeCursor % LEGACY + 1;
      if(k===mySlot) continue;
      var id=idFor(k);
      if(conns[id] || pending[id]) continue;
      reach(id); tried++;
    }
  }
  function fullSweep(){
    for(var b=0;b<4;b++) setTimeout(function(){ sweep(6); }, b*1200);
  }
  function pendingCount(){ return Object.keys(pending).length; }
  function reach(id){
    if(!peer || conns[id] || pending[id]) return;
    if(pendingCount() >= 5) return;          /* 한꺼번에 너무 많이 열지 않는다 */
    try{
      var dc = peer.connect(id, {reliable:true, metadata:{name:myName}});
      wireData(dc, false);
    }catch(e){}
  }
  // incoming === true 일 때만 metadata.name 이 '상대' 이름이다.
  // 내가 건 연결의 metadata 는 내가 보낸 값이므로 이름으로 쓰면 안 된다.
  function wireData(dc, incoming){
    var id = dc.peer;
    if(incoming && dc.metadata && dc.metadata.name) names[id] = dc.metadata.name;
    pending[id] = dc;
    setTimeout(function(){
      if(pending[id] === dc && !(conns[id])){ closePC(dc); delete pending[id]; }
    }, 7000);
    dc.on("open", function(){
      delete pending[id];
      conns[id] = dc;
      lastSeen[id] = Date.now();
      dc.send({t:"hi", name:myName, pid:myPid, key:myKey});
      placeCall(id);
      render();
    });
    dc.on("data", function(m){
      if(!m || !m.t) return;
      lastSeen[id] = Date.now();
      if(m.t==="ping"){ try{ dc.send({t:"pong"}); }catch(e){} return; }
      if(m.t==="pong"){ return; }
      if(m.t==="hi"){
        names[id]=m.name;
        rememberName(m.name);
        if(m.pid) rememberPid(m.name, m.pid);
        if(m.key) rememberKey(m.name, m.key);
        if(!dc.__greeted){ dc.__greeted = true; try{ dc.send({t:"hi", name:myName, pid:myPid, key:myKey}); }catch(e){} }
      }
      else if(m.t==="talk"){
        var wasTalking = talking[id];
        talking[id]=true; talkAt[id]=Date.now(); dmFrom[id]=!!m.dm;
        if(!wasTalking) cueIncoming(!!m.dm);
      }
      else if(m.t==="stop"){ talking[id]=false; dmFrom[id]=false; }
      else if(m.t==="bye"){ drop(id); return; }
      render();
    });
    dc.on("close", function(){ drop(id); });
    dc.on("error", function(){ drop(id); });
  }
  /* 한 쌍에 음성 연결은 하나만 둔다. 둘 다 걸면 하나가 끊기며 소리가 끊긴다 */
  var callTry = {};
  function placeCall(id, force){
    if(!peer || calls[id]) return;
    if(!force && myPeerId && id < myPeerId) return;   /* 작은 쪽이 건다 */
    var now = Date.now();
    if(callTry[id] && now - callTry[id] < 6000) return;
    callTry[id] = now;
    try{
      var mc = peer.call(id, streamFor(id), {metadata:{name:myName}});
      wireCall(mc);
    }catch(e){}
  }
  function clearAudio(id){
    var el = document.getElementById("a-"+id);
    if(el){ try{ el.srcObject = null; }catch(e){} }
  }
  function wireCall(mc){
    var id = mc.peer;
    calls[id]=mc;
    mc.on("stream", function(rs){
      var el = document.getElementById("a-"+id);
      if(!el){
        el=document.createElement("audio");
        el.id="a-"+id; el.autoplay=true; el.playsInline=true;
        document.body.appendChild(el);
      }
      el.srcObject = rs;
      var pr = el.play(); if(pr && pr.catch) pr.catch(function(){});
    });
    mc.on("close", function(){
      closePC(mc);
      if(calls[id] === mc){ delete calls[id]; clearAudio(id); }
    });
    mc.on("error", function(){
      closePC(mc);
      if(calls[id] === mc){ delete calls[id]; clearAudio(id); }
    });
  }
  /* 닫지 않은 연결이 쌓이면 브라우저 한도에 걸려 더는 연결을 못 만든다 */
  function closePC(o){
    try{ o && o.peerConnection && o.peerConnection.close(); }catch(e){}
    try{ o && o.close(); }catch(e){}
  }
  function drop(id){
    closePC(conns[id]); closePC(pending[id]); closePC(calls[id]);
    try{ conns[id] && conns[id].close(); }catch(e){}
    try{ pending[id] && pending[id].close(); }catch(e){}
    try{ calls[id] && calls[id].close(); }catch(e){}
    delete conns[id]; delete pending[id]; delete calls[id]; delete names[id];
    delete talking[id]; delete talkAt[id]; delete dmFrom[id]; delete lastSeen[id];
    if(clones[id]){ clones[id].getTracks().forEach(function(t){t.stop();}); delete clones[id]; }
    if(outTrack[id]){ try{ outTrack[id].stop(); }catch(e){} delete outTrack[id]; }
    var el=document.getElementById("a-"+id); if(el) el.remove();
    if(target===id) target="";
    if(joined) render();
  }
  function openIds(){
    return Object.keys(conns).filter(function(i){ return conns[i] && conns[i].open; });
  }

  /* ---------- 끊김 방지: 감시 + 연결 유지 ---------- */
  function setPill(extra){
    pill.innerHTML = "채널 <b>"+esc(channel)+"</b>" + (extra ? " · " + extra : "");
  }

  function attachPeerHandlers(){
    peer.on("connection", function(dc){ wireData(dc, true); });
    peer.on("call", function(mc){
      var pid2 = mc.peer;
      if(calls[pid2] && calls[pid2] !== mc){ closePC(calls[pid2]); delete calls[pid2]; }
      mc.answer(streamFor(pid2));
      wireCall(mc);
    });
    peer.on("error", function(e){
      if(!e) return;
      if(e.type==="peer-unavailable"){
        var m = String(e.message||"").match(/[\w-]*jhwt-[\w-]+/);
        if(m && pending[m[0]]) delete pending[m[0]];
        return;
      }
      if(e.type==="network"||e.type==="server-error") setPill("재연결 중…");
    });
    peer.on("disconnected", function(){
      setPill("재연결 중…");
      try{ peer.reconnect(); }catch(e){}
    });
    peer.on("close", function(){ if(joined) rebuildPeer(); });
    peer.on("open", function(){ setPill(); });
  }

  var lastRebuildFail = 0;
  async function rebuildPeer(){
    if(rebuilding || !joined) return;
    if(Date.now() - lastRebuildFail < 15000) return;   /* 실패 직후엔 잠시 쉰다 */
    rebuilding = true;
    setPill("재연결 중…");
    try{
      try{ peer && peer.destroy(); }catch(e){}
      Object.keys(conns).forEach(function(id){ closePC(conns[id]); });
      Object.keys(pending).forEach(function(id){ closePC(pending[id]); });
      Object.keys(calls).forEach(function(id){ closePC(calls[id]); });
      Object.keys(clones).forEach(function(id){
        clones[id].getTracks().forEach(function(t){ t.stop(); });
      });
      document.querySelectorAll('audio[id^="a-"]').forEach(function(el){ el.remove(); });
      conns={}; pending={}; calls={}; clones={}; talking={}; dmFrom={}; lastSeen={};
      peer = null;

      var ok = await claimMine();
      if(ok){
        attachPeerHandlers();
        dialKnown();
        setPill();
      }else{
        lastRebuildFail = Date.now();
        setPill("재연결 실패 — 잠시 후 다시 시도");
      }
      render();
    } finally { rebuilding = false; }
  }

  function watchdog(){
    if(!joined || rebuilding) return;
    if(!peer || peer.destroyed){ rebuildPeer(); return; }
    if(peer.disconnected){ setPill("재연결 중…"); try{ peer.reconnect(); }catch(e){} }
    // 아는 상대에게 다시 붙기
    dialKnown();
    // 옛 방식으로 들어온 기기가 있을 수 있으니 가끔만 훑는다
    legacyTick++;
    /* 아무도 안 붙어 있을 때만 옛 자리를 훑는다 — 연결 객체를 아끼기 위해 */
    if(!openIds().length && (legacyTick <= 15 || legacyTick % 5 === 0)) sweep(2);
    // 붙어 있는데 음성 연결이 없으면 다시 건다
    openIds().forEach(function(id){
      if(!calls[id]) placeCall(id, true);
    });
    // 15초 넘게 소식 없는 '말하는 중' 은 해제한다
    var tnow = Date.now(), changed = false;
    for(var tk in talking){
      if(talking[tk] && tnow - (talkAt[tk] || 0) > 15000){
        talking[tk] = false; dmFrom[tk] = false; changed = true;
      }
    }
    if(changed) render();
    // 응답 없는 상대 정리
    var now = Date.now();
    openIds().forEach(function(id){
      if(!lastSeen[id]) lastSeen[id] = now;
      if(now - lastSeen[id] > 60000) drop(id);
    });
    if(!rebuilding && peer && !peer.disconnected) setPill();
  }

  function startLoops(){
    stopLoops();
    loadMembers();
    memberTimer = setInterval(loadMembers, 30000);
    scanTimer = setInterval(watchdog, 4000);
    pingTimer = setInterval(function(){
      if(!joined) return;
      openIds().forEach(function(id){
        try{ conns[id].send({t:"ping"}); }catch(e){ drop(id); }
      });
    }, 8000);
  }
  function stopLoops(){
    if(scanTimer){ clearInterval(scanTimer); scanTimer=null; }
    if(pingTimer){ clearInterval(pingTimer); pingTimer=null; }
    if(memberTimer){ clearInterval(memberTimer); memberTimer=null; }
  }

  /* ---------- 접속 / 나가기 ---------- */

  /* 앱을 닫거나 꺼질 때 상대에게 알려 준다 — 명단에 유령이 남지 않게 */
  function sayBye(){
    openIds().forEach(function(id){ try{ conns[id].send({t:"bye"}); }catch(e){} });
  }
  function releasePeer(){
    sayBye();
    try{ peer && peer.destroy(); }catch(e){}   /* 서버에 자리를 바로 돌려준다 */
  }
  /* 안드로이드는 화면만 꺼도 pagehide 가 온다 — 여기서는 연결을 끊지 않는다 */
  window.addEventListener("pagehide", function(e){ if(!e.persisted) sayBye(); });
  window.addEventListener("beforeunload", releasePeer);
  /* 다른 앱 쓰다 돌아오면 바로 명단을 새로 확인한다 (화면이 꺼진 동안은 타이머가 느려짐) */
  /* 화면이 꺼지면 페이지가 멈춰 서버에는 살아있는 척 남는다(유령).
     45초 이상 꺼져 있으면 자리를 반납하고, 돌아오면 바로 다시 잡는다. */
  var hideTimer = null;
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden" && joined){
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function(){
        if(document.visibilityState !== "hidden" || !joined) return;
        sayBye();
        try{ peer && peer.destroy(); }catch(e){}
        peer = null;
      }, 45000);
      return;
    }
    clearTimeout(hideTimer);
    if(document.visibilityState === "visible" && joined){
      if(!peer || peer.destroyed){ rebuildPeer(); return; }
      if(peer && peer.disconnected){ try{ peer.reconnect(); }catch(e){} }
      try{ watchdog(); }catch(e){}
      loadMembers();
      openIds().forEach(function(id){ try{ conns[id].send({t:"ping"}); }catch(e){} });
    }
  });

  $("leave").onclick = function(){
    joined=false; stopTx(); releaseMic(); stopLoops();
    openIds().forEach(function(id){ try{ conns[id].send({t:"bye"}); }catch(e){} });
    Object.keys(conns).forEach(drop);
    if(micStream) micStream.getTracks().forEach(function(t){t.stop();});
    if(peer){ try{ peer.destroy(); }catch(e){} }
    peer=null; micStream=null; micTrack=null;
    document.querySelectorAll('audio[id^="a-"]').forEach(function(el){ el.remove(); });
    conns={}; pending={}; calls={}; clones={}; names={}; talking={}; dmFrom={}; lastSeen={};
    target="";
    holdScreen(false); keepAudioAlive(false);
    live.style.display="none"; setup.style.display="flex";
    pill.textContent="대기 중";
  };

  /* ---------- PTT ---------- */
  async function startTx(){
    if(!joined || txing) return;
    stopRing();
    if(!target){ toast("명단에서 보낼 사람을 먼저 골라 주세요"); return; }
    if(!(conns[target] && conns[target].open)){ toast("상대가 연결되어 있지 않습니다"); return; }
    pttHeld = true;
    audioCtx();

    if(!micTrack || micTrack.readyState !== "live"){
      ptt.classList.add("down"); ptt.textContent="마이크 켜는 중…";
      var ok = await acquireMic();
      if(!ok){
        pttHeld = false;
        ptt.classList.remove("down"); ptt.textContent="누르고 말하기";
        toast("마이크 권한이 필요합니다. 설정에서 마이크를 허용해 주세요");
        return;
      }
      if(!pttHeld){                      /* 기다리는 사이에 손을 뗐다 */
        ptt.classList.remove("down"); ptt.textContent="누르고 말하기";
        micHoldBump();
        return;
      }
    }
    micHoldBump();

    txIds = (conns[target] && conns[target].open) ? [target] : [];
    if(!txIds.length){
      pttHeld = false;
      ptt.classList.remove("down"); ptt.textContent="누르고 말하기";
      toast("상대가 연결되어 있지 않습니다"); return;
    }
    txing=true;
    txIds.forEach(function(id){
      streamFor(id).getAudioTracks().forEach(function(t){ t.enabled=true; });
      try{ conns[id].send({t:"talk", dm: true}); }catch(e){}
    });
    ptt.classList.add("down"); ptt.textContent="송신 중…";
    beep(1100,0.07,0.05); buzz(25);
    clearInterval(txKeep);
    txKeep = setInterval(function(){
      if(!txing){ clearInterval(txKeep); return; }
      txIds.forEach(function(id){ try{ conns[id].send({t:"talk", dm:true}); }catch(e){} });
    }, 5000);
  }
  var txKeep = null;
  function stopTx(){
    pttHeld = false;
    clearInterval(txKeep); txKeep = null;
    if(!txing){ if(micTrack) micHoldBump(); return; }
    txing=false;
    micHoldBump();
    txIds.forEach(function(id){
      if(clones[id]) clones[id].getAudioTracks().forEach(function(t){ t.enabled=false; });
      try{ conns[id] && conns[id].send({t:"stop"}); }catch(e){}
    });
    txIds=[];
    ptt.classList.remove("down"); ptt.textContent="누르고 말하기";
    beep(620,0.06,0.04);
  }
  ["pointerdown","touchstart"].forEach(function(ev){
    ptt.addEventListener(ev, function(e){ e.preventDefault(); startTx(); }, {passive:false});
  });
  ["pointerup","pointercancel","pointerleave","touchend","touchcancel"].forEach(function(ev){
    ptt.addEventListener(ev, function(e){ e.preventDefault(); stopTx(); }, {passive:false});
  });
  window.addEventListener("blur", stopTx);
  document.addEventListener("keydown", function(e){ if(e.code==="Space" && joined){ e.preventDefault(); startTx(); } });
  document.addEventListener("keyup",   function(e){ if(e.code==="Space"){ e.preventDefault(); stopTx(); } });

  window.addEventListener("beforeunload", function(){
    openIds().forEach(function(id){ try{ conns[id].send({t:"bye"}); }catch(e){} });
  });

  /* ---------- 푸시 호출 (앱이 꺼져 있어도 울림) ---------- */
  var VAPID_PUB = "BFdAOvacqW4B7n5n_6BO-8_bRjlj_6j-f3nKOR_RBsJXVgdplNzPclY36bZ9dE4OVHBjv2h_OUd5EdcGpMAyMPA";
  var myEndpoint = "", members = [], myPid = "";

  /* 서버는 등록 주소를 SHA-256 으로 줄여 번호로 쓴다. 같은 방식으로 내 번호를 구한다 */
  async function pidOf(endpoint){
    var h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(endpoint));
    var a = Array.prototype.map.call(new Uint8Array(h), function(b){
      return ("0"+b.toString(16)).slice(-2);
    }).join("");
    return a.slice(0,32);
  }
  /* 가족이 알림을 다시 켜면 번호가 바뀐다 — 서로 만났을 때 주고받아 기억해 둔다 */
  var PID_KEY = "jhwt.pid";
  function pidMap(){
    try{ return JSON.parse(localStorage.getItem(PID_KEY) || "{}"); }catch(e){ return {}; }
  }
  function rememberPid(nm, pid){
    if(!nm || !pid || !/^[a-f0-9]{32}$/.test(pid) || !familyName(nm)) return;
    var m = pidMap();
    if(m[nm] === pid) return;
    m[nm] = pid;
    try{ localStorage.setItem(PID_KEY, JSON.stringify(m)); }catch(e){}
    applyPids();
  }
  /* 기억해 둔 번호를 명단에 덮어쓴다 */
  function applyPids(){
    var m = pidMap(), changed = false;
    Object.keys(m).forEach(function(nm){
      var hit = null;
      for(var i=0;i<members.length;i++) if(members[i].name === nm) hit = members[i];
      if(hit){ if(hit.id !== m[nm]){ hit.id = m[nm]; changed = true; } }
      else { members.push({ id:m[nm], name:nm, at:0 }); changed = true; }
    });
    if(changed && joined) render();
  }

  /* 알림 서버는 넷리파이에 있다. 다른 주소에서 열어도 그쪽으로 보낸다 */
  var API = (location.host.indexOf("jh-walkie.netlify.app") >= 0) ? "" : "https://jh-walkie.netlify.app";
  var XORIGIN = API !== "";
  function apiRead(path, data){           /* 답을 읽어야 하는 요청 */
    return fetch(API + "/.netlify/functions/" + path, {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify(data)
    }).then(function(r){ return r.json(); });
  }
  function apiSend(path, data){           /* 보내기만 하는 요청 — 다른 주소에서도 통한다 */
    if(!XORIGIN) return apiRead(path, data);
    return fetch(API + "/.netlify/functions/" + path, {
      method:"POST", mode:"no-cors",
      headers:{"content-type":"text/plain;charset=UTF-8"},
      body: JSON.stringify(data)
    }).then(function(){ return { ok:true, blind:true }; });
  }

  /* 서버 명단을 읽을 수 없을 때 쓰는 기본 명단 */
  var ROSTER = [
    { id:"3780688c546bbc5ab27be58c8875f0cb", name:"아빠" },
    { id:"b0874d299fcdefcb9e6ee2b2412b6995", name:"엄마" },
    { id:"ea4edbbe6a17cd72a22d69a4f4268289", name:"아라" },
    { id:"32fc9ac4b2db3b62a50843dac758490d", name:"테블릿" },
    { id:"54c233007641913f57a6a404b3726824", name:"이든" }
  ];
  var ROSTER_KEY = "jhwt.roster";

  /* 한 번이라도 본 가족 이름을 기억해 둔다 — 서버 명단에서 빠져도 사라지지 않게 */
  var KNOWN_KEY = "jhwt.known";
  function knownNames(){
    try{ return JSON.parse(localStorage.getItem(KNOWN_KEY) || "[]"); }catch(e){ return []; }
  }
  function rememberName(nm){
    if(!nm || nm === "이름 확인 중" || !familyName(nm)) return;
    var list = knownNames();
    if(list.indexOf(nm) >= 0) return;
    list.push(nm);
    if(list.length > 12) list = list.slice(-12);
    try{ localStorage.setItem(KNOWN_KEY, JSON.stringify(list)); }catch(e){}
  }

  async function loadMembers(){
    try{
      var j = await apiRead("subs", { action:"list" });
      if(j.ok && Array.isArray(j.members) && j.members.length){
        members = j.members;
        for(var i=0;i<members.length;i++) rememberName(members[i].name);
        try{ localStorage.setItem(ROSTER_KEY, JSON.stringify(members)); }catch(e){}
        applyPids();
        if(joined) render();
        return;
      }
    }catch(e){}
    /* 서버 명단을 못 읽는 주소 — 저장해 둔 명단으로 채운다 */
    if(!members.length){
      var saved = [];
      try{ saved = JSON.parse(localStorage.getItem(ROSTER_KEY) || "[]"); }catch(e){}
      members = (saved.length ? saved : ROSTER.slice());
      applyPids();
      if(joined) render();
    }
  }

  async function ringOne(id, nm){
    if(!confirm(nm + "님을 호출할까요?\n폰이 꺼져 있어도 알림이 울립니다.")) return;
    try{
      /* 상대가 알림을 다시 켜면 번호가 바뀐다.
         아는 번호가 여러 개면 모두 보낸다 — 죽은 번호는 아무 일도 일어나지 않는다 */
      var tries = [], pm = pidMap();
      function add(x){ if(x && /^[a-f0-9]{32}$/.test(x) && tries.indexOf(x) < 0) tries.push(x); }
      add(id); add(pm[nm]);
      for(var r=0;r<ROSTER.length;r++) if(ROSTER[r].name === nm) add(ROSTER[r].id);
      for(var mi=0;mi<members.length;mi++) if(members[mi].name === nm) add(members[mi].id);

      var j = { blind:true };
      for(var ti=0; ti<tries.length; ti++){
        j = await apiSend("call", { from: myName, to: tries[ti], exclude: myEndpoint });
      }
      if(j.blind){ toast(nm + "님에게 호출을 보냈습니다"); return; }
      toast(j.sent ? (nm + "님을 호출했습니다") : (nm + "님에게 보내지 못했습니다"));
      if(j.gone) loadMembers();
    }catch(e){ toast("호출 실패: " + (e.message||e)); }
  }

  function b64ToU8(s){
    var p = (s + "=".repeat((4 - s.length % 4) % 4)).replace(/-/g,"+").replace(/_/g,"/");
    var raw = atob(p), u = new Uint8Array(raw.length);
    for (var i=0;i<raw.length;i++) u[i] = raw.charCodeAt(i);
    return u;
  }
  function pushUI(){
    var box = $("push"), btn = $("pushBtn");
    if(!("PushManager" in window)){ box.style.display="none"; return; }
    if(Notification.permission === "granted"){
      box.classList.add("on");
      btn.textContent = myEndpoint ? "알림 켜짐 ✓" : "알림 켜는 중…";
    } else if(Notification.permission === "denied"){
      btn.textContent = "브라우저에서 허용 필요";
    } else {
      box.classList.remove("on"); btn.textContent = "알림 켜기";
    }
  }
  async function enablePush(ask){
    if(!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
    try{
      var perm = Notification.permission;
      if(perm === "default"){
        if(!ask) return false;
        perm = await Notification.requestPermission();
      }
      if(perm !== "granted"){
        if(ask) toast("알림이 차단되어 있습니다. 주소창 자물쇠 → 알림 허용");
        pushUI(); return false;
      }
      var reg = await navigator.serviceWorker.ready;
      var sub = await reg.pushManager.getSubscription();
      if(!sub) sub = await reg.pushManager.subscribe({
        userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID_PUB)
      });
      var nm = (nmEl.value||"").trim() || myName || "가족";
      var j = await apiSend("subs", { name: nm, sub: sub });
      if(!j.ok) throw new Error(j.err || "등록 실패");
      myEndpoint = sub.endpoint;
      try{ myPid = await pidOf(sub.endpoint); }catch(e){}
      openIds().forEach(function(id){ try{ conns[id].send({t:"hi", name:myName, pid:myPid, key:myKey}); }catch(e){} });
      rememberName(nm);
      pushUI();
      loadMembers();
      if(ask) toast(j.blind ? "알림 켜짐" : ("알림 켜짐 — 등록된 기기 " + (j.registered||1) + "대"));
      return true;
    }catch(e){
      if(ask) toast("알림 설정 실패: " + (e.message||e));
      pushUI(); return false;
    }
  }
  $("pushBtn").onclick = function(){ enablePush(true); };

  /* ---------- 복원 / 설치 ---------- */
  try{
    var s=JSON.parse(localStorage.getItem("wt")||"{}");
    if(s.n) nmEl.value=s.n;
  }catch(e){}

  var deferred=null;
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); deferred=e; $("install").style.display="block";
  });
  $("installBtn").onclick = async function(){
    if(!deferred){ toast("브라우저 메뉴 ⋮ → 홈 화면에 추가 를 눌러주세요"); return; }
    deferred.prompt(); await deferred.userChoice;
    deferred=null; $("install").style.display="none";
  };
  if(window.matchMedia("(display-mode: standalone)").matches) $("install").style.display="none";

  /* 한 번 허용했으면 새 빌드가 적용돼도 다시 누를 필요 없이 알아서 켜진다.
     처음 설치했을 때(권한 '물어보기' 상태)만 버튼을 누르게 한다. */
  function keepPushOn(){
    if(Notification.permission !== "granted") return;
    if(myEndpoint) return;
    enablePush(false);
  }
  setTimeout(keepPushOn, 2500);
  setTimeout(keepPushOn, 8000);
  setInterval(keepPushOn, 60000);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") keepPushOn();
  });

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").then(function(){
      // 이미 허용돼 있으면 조용히 등록 갱신
      enablePush(false);
      pushUI();
    }).catch(function(){});
    navigator.serviceWorker.addEventListener("message", function(e){
      if(!e.data) return;
      if(e.data.t === "autojoin" && !joined) joinBtn.click();
      if(e.data.t === "ring"){
        audioSession("playback");
        try{ navigator.vibrate && navigator.vibrate([300,120,300,120,500]); }catch(err){}
        ringTone(10, e.data.from || "");
        toast((e.data.from ? e.data.from + "님이" : "누군가") + " 부르고 있습니다");
      }
      if(e.data.t === "stopring") stopRing();
    });
  }
  pushUI();

  // 알림을 눌러서 열렸으면 바로 접속
  if(/[?&]join=1/.test(location.search) && nmEl.value.trim()){
    setTimeout(function(){ if(!joined) joinBtn.click(); }, 400);
  }

  /* ---------- 새 버전 자동 반영 ----------
     앱을 끄지 않아도 새 버전을 스스로 받아 적용한다.
     말하는 중이거나 상대가 말하는 중에는 미루고, 조용할 때 적용한다. */
  var APPV = "37", newV = "", applying = false;
  var BUILT = "2026-11-14 09:27";
  function showVer(extra){
    try{
      document.getElementById("ver").textContent =
        "버전 " + APPV + " · " + BUILT + (extra ? " · " + extra : "");
    }catch(e){}
  }
  showVer();
  async function checkVersion(){
    if(applying) return;
    try{
      var r = await fetch("version.json?t=" + Date.now(), { cache:"no-store" });
      if(!r.ok) return;
      var j = await r.json();
      if(!j || !j.v || j.v === APPV) return;
      newV = j.v;
      applyUpdate();
    }catch(e){}
  }
  function busy(){
    if(txing || pttHeld) return true;
    for(var k in talking) if(talking[k]) return true;
    return false;
  }
  var deferSince = 0;
  function applyUpdate(){
    if(!newV || applying) return;
    if(busy()){                                   /* 대화 중이면 미루되, 2분을 넘기지 않는다 */
      if(!deferSince) deferSince = Date.now();
      if(Date.now() - deferSince < 120000){ setTimeout(applyUpdate, 5000); return; }
    }
    deferSince = 0;
    applying = true;
    toast("새 버전 적용 중…");
    try{
      if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
        navigator.serviceWorker.getRegistrations().then(function(rs){
          rs.forEach(function(x){ try{ x.update(); }catch(e){} });
        });
      }
    }catch(e){}
    setTimeout(function(){
      /* 주소에 버전을 붙여야 브라우저가 옛 파일을 내주지 않는다 */
      var u = location.pathname + "?v=" + encodeURIComponent(newV) + (joined ? "&join=1" : "");
      location.replace(u);
    }, 1200);
  }
  setTimeout(checkVersion, 15000);
  setInterval(checkVersion, 300000);                        /* 5분마다 */
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") checkVersion();
  });
})();
</script>
</body>
</html>
